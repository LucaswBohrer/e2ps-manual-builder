name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-installer:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build executable and installer
        shell: cmd
        run: packaging\build_windows.bat

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: E2PS-Manual-Builder-Windows-Installer
          path: release/E2PS-Manual-Builder-Setup-1.0.0.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable application folder
        uses: actions/upload-artifact@v4
        with:
          name: E2PS-Manual-Builder-Windows-Portable
          path: dist/E2PS Manual Builder
          if-no-files-found: error
          retention-days: 30

      - name: Upload installer to the GitHub Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.4' }}
        run: |
          gh release upload "$env:RELEASE_TAG" `
            "release/E2PS-Manual-Builder-Setup-1.0.0.exe" `
            --repo "${{ github.repository }}" `
            --clobber
