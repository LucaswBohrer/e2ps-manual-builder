name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-installer:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build executable and installer
        shell: cmd
        run: packaging\build_windows.bat

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: E2PS-Manual-Builder-Windows-Installer
          path: release/E2PS-Manual-Builder-Setup-1.0.0.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable application folder
        uses: actions/upload-artifact@v4
        with:
          name: E2PS-Manual-Builder-Windows-Portable
          path: dist/E2PS Manual Builder
          if-no-files-found: error
          retention-days: 30

      - name: Publish installer in the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: E2PS Manual Builder ${{ github.ref_name }}
          generate_release_notes: true
          files: release/E2PS-Manual-Builder-Setup-1.0.0.exe
